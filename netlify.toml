[build]
  command = "pnpm build && pnpm check:budget"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "12.4.1"

# Existing public/_headers is copied to dist by Vite; it owns CSP and isolation headers.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# WASM paths are stable filenames, so revalidate rather than cache across releases.
[[headers]]
  for = "/wasm/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
