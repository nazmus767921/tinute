name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Code Quality & Budgets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.9.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Code Formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Strict TypeScript Check
        run: pnpm typecheck

      - name: Run Unit & Component Tests
        run: pnpm test

      - name: Build Production Assets
        run: pnpm build

      - name: Enforce Performance Budgets (≤ 150 KB initial JS)
        run: pnpm check:budget
