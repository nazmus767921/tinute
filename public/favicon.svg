<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Comic Squircle Badge Background -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="#FFDE30" stroke="#12141C" stroke-width="2.5" />
  
  <!-- Antenna -->
  <line x1="24" y1="12" x2="24" y2="6.5" stroke="#12141C" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="24" cy="5.5" r="2.8" fill="#00E5FF" stroke="#12141C" stroke-width="1.2" />
  <circle cx="23.2" cy="4.7" r="0.9" fill="#FFFFFF" />

  <!-- Ear Bolts -->
  <rect x="6" y="20.5" width="3.5" height="9" rx="1.75" fill="#F1F5F9" stroke="#12141C" stroke-width="1.5" />
  <rect x="38.5" y="20.5" width="3.5" height="9" rx="1.75" fill="#F1F5F9" stroke="#12141C" stroke-width="1.5" />

  <!-- CRT Head Casing -->
  <rect x="8" y="11.5" width="32" height="27" rx="8" fill="#FFFFFF" stroke="#12141C" stroke-width="2.2" />

  <!-- CRT Screen Display -->
  <rect x="11" y="14.5" width="26" height="21" rx="5.5" fill="#12141C" />

  <!-- Screen Gloss Reflection -->
  <path d="M13 17 Q24 18.5 35 17" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.2" stroke-linecap="round" />

  <!-- Cute Cheek Blush -->
  <ellipse cx="14.5" cy="27.5" rx="1.8" ry="1.1" fill="#FF3B86" opacity="0.8" />
  <ellipse cx="33.5" cy="27.5" rx="1.8" ry="1.1" fill="#FF3B86" opacity="0.8" />

  <!-- Cute Eyes -->
  <circle cx="18.5" cy="22.5" r="2.8" fill="#00E5FF" />
  <circle cx="29.5" cy="22.5" r="2.8" fill="#00E5FF" />

  <!-- Dual Catchlights for Sparkle -->
  <circle cx="19.4" cy="21.6" r="1" fill="#FFFFFF" />
  <circle cx="17.8" cy="23.2" r="0.5" fill="#FFFFFF" />
  <circle cx="30.4" cy="21.6" r="1" fill="#FFFFFF" />
  <circle cx="28.8" cy="23.2" r="0.5" fill="#FFFFFF" />

  <!-- Friendly Smile -->
  <path d="M20 27.2 Q24 31 28 27.2" stroke="#00E5FF" stroke-width="1.6" stroke-linecap="round" fill="none" />
</svg>